name: AI Trading Bot (Paper)

on:
  # GitHub מפעיל הרצות מתוזמנות באיחור (בפועל בערך פעם בשעה), ולכן כל הרצה נשארת
  # בחיים עד ~5.5 שעות ובודקת בעצמה כל 10 דקות עד סגירת השוק. ההרצה הבאה מחכה בתור וממשיכה.
  # הבוט עצמו בודק מול Alpaca אם השוק באמת פתוח, כך ששעון קיץ/חורף לא משנה.
  schedule:
    - cron: "7 13-20 * * 1-5"
  # הרצה ידנית מהטלפון: Actions -> AI Trading Bot -> Run workflow
  workflow_dispatch:
    inputs:
      mode:
        description: "check = בדיקת חיבור בלבד, trade = הרצת מסחר רגילה"
        type: choice
        options: [check, trade]
        default: check

permissions:
  contents: write   # כדי לשמור את יומן המסחר ואת דף המצב
  issues: write     # כדי לכתוב התראות ב-Issue "התראות בוט המסחר"

concurrency:
  # בדיקת חיבור לא מחכה בתור מאחורי יום מסחר שלם
  group: trading-bot-${{ inputs.mode == 'check' && 'check' || 'trade' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$MODE" = "check" ]; then
            python bot.py --check
          elif [ "$EVENT" = "schedule" ]; then
            python bot.py --loop-minutes 330 --every 10
          else
            python bot.py
          fi

      - name: Save journal
        if: always()
        run: |
          if [ -n "$(git status --porcelain journal STATUS.md 2>/dev/null)" ]; then
            git config user.name "trading-bot"
            git config user.email "trading-bot@users.noreply.github.com"
            git add journal STATUS.md 2>/dev/null || git add journal
            git commit -m "journal: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push || echo "could not push journal"
          fi
