name: AI Trading Bot (Paper)

on:
  # כל 10 דקות, שני-שישי, בשעות שהשוק בארה"ב יכול להיות פתוח (שעון UTC).
  # הבוט עצמו בודק מול Alpaca אם השוק באמת פתוח, כך ששעון קיץ/חורף לא משנה.
  schedule:
    - cron: "3-59/10 13-20 * * 1-5"
  # הרצה ידנית מהטלפון: Actions -> AI Trading Bot -> Run workflow
  workflow_dispatch:
    inputs:
      mode:
        description: "check = בדיקת חיבור בלבד, trade = הרצת מסחר רגילה"
        type: choice
        options: [check, trade]
        default: check

permissions:
  contents: write   # כדי לשמור את יומן המסחר בתיקייה journal/

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "check" ]; then
            python bot.py --check
          else
            python bot.py
          fi

      - name: Save journal
        if: always()
        run: |
          if [ -n "$(git status --porcelain journal 2>/dev/null)" ]; then
            git config user.name "trading-bot"
            git config user.email "trading-bot@users.noreply.github.com"
            git add journal
            git commit -m "journal: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push || echo "could not push journal"
          fi
